<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jazzlab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app/css/app.css">
<script>
  // apply the saved theme before first paint (no flash)
  try { var th = JSON.parse(localStorage.getItem('jazzlab:theme')); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<script type="module" src="app/js/main.js"></script>
</head>
<body>
<div id="app"><noscript>Jazzlab needs JavaScript.</noscript></div>
</body>
</html>
